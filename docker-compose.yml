services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-addmin}
    ports:
      - "${POSTGRES_PORT:-}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - addmin-network

  # Backend API
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-addmin}
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/api:/app/services/api
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - addmin-network
    command: pnpm --filter @addmin/api dev

  # Website (Marketing)
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-key-min-32-characters-long}
      API_URL: http://api:${API_PORT:-4000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/website:/app/apps/website
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - addmin-network
    command: pnpm --filter @addmin/website dev

  # Operator (Control Plane)
  operator:
    build:
      context: .
      dockerfile: apps/operator/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-key-min-32-characters-long}
      API_URL: http://api:${API_PORT:-4000}
    ports:
      - "3001:3001"
    depends_on:
      - api
    volumes:
      - ./apps/operator:/app/apps/operator
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - addmin-network
    command: pnpm --filter @addmin/operator dev

  # Tenant (Product App)
  tenant:
    build:
      context: .
      dockerfile: apps/tenant/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-key-min-32-characters-long}
      API_URL: http://api:${API_PORT:-4000}
    ports:
      - "3002:3002"
    depends_on:
      - api
    volumes:
      - ./apps/tenant:/app/apps/tenant
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - addmin-network
    command: pnpm --filter @addmin/tenant dev

volumes:
  postgres_data:
    driver: local

networks:
  addmin-network:
    driver: bridge
