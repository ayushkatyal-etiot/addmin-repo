version: "1"
description: "AddMin runscripts for Conductor"

runscripts:
  # Launch all web apps with Docker
  - id: launch-apps
    name: "Launch Web Apps (Docker)"
    description: "Start all services (PostgreSQL, API, Website, Operator, Tenant) with Docker and open in browser"
    command: "./scripts/launch-apps.sh"
    workingDirectory: "."
    icon: "rocket"
    tags:
      - docker
      - dev
      - apps
    environment:
      - NODE_ENV=development
    autoPause: false
    showOutput: true

  # Launch with --no-build flag
  - id: launch-apps-fast
    name: "Launch Web Apps (Fast - Skip Build)"
    description: "Start services without rebuilding Docker images (faster if already built)"
    command: "./scripts/launch-apps.sh --no-build"
    workingDirectory: "."
    icon: "zap"
    tags:
      - docker
      - dev
      - quick
    environment:
      - NODE_ENV=development
    autoPause: false
    showOutput: true

  # Launch without opening browser
  - id: launch-apps-quiet
    name: "Launch Web Apps (No Browser)"
    description: "Start all services but don't open browser automatically"
    command: "./scripts/launch-apps.sh --no-open"
    workingDirectory: "."
    icon: "server"
    tags:
      - docker
      - dev
      - server-only
    environment:
      - NODE_ENV=development
    autoPause: false
    showOutput: true

  # Stop all services
  - id: stop-services
    name: "Stop All Services"
    description: "Stop all Docker containers gracefully"
    command: "docker-compose down"
    workingDirectory: "."
    icon: "stop-circle"
    tags:
      - docker
      - management
    autoPause: false
    showOutput: true

  # View logs
  - id: view-logs
    name: "View Service Logs"
    description: "Stream real-time logs from all services"
    command: "docker-compose logs -f"
    workingDirectory: "."
    icon: "terminal"
    tags:
      - docker
      - debug
      - logs
    autoPause: false
    showOutput: true

  # Database shell
  - id: db-shell
    name: "Database Shell"
    description: "Connect to PostgreSQL database shell"
    command: "docker-compose exec postgres psql -U postgres -d addmin"
    workingDirectory: "."
    icon: "database"
    tags:
      - docker
      - database
      - psql
    autoPause: false
    showOutput: true

  # Run migrations
  - id: db-migrate
    name: "Run Database Migrations"
    description: "Apply pending database migrations"
    command: "docker-compose exec api pnpm --filter @addmin/db db:migrate:dev"
    workingDirectory: "."
    icon: "arrow-up"
    tags:
      - docker
      - database
      - migrations
    autoPause: false
    showOutput: true

  # Type checking
  - id: type-check
    name: "Type Check"
    description: "Run TypeScript type checking across all packages"
    command: "pnpm type-check"
    workingDirectory: "."
    icon: "check-circle"
    tags:
      - dev
      - typescript
      - quality
    autoPause: false
    showOutput: true

  # Show help
  - id: launch-help
    name: "Launch Script Help"
    description: "Show help for launch-apps.sh script"
    command: "./scripts/launch-apps.sh --help"
    workingDirectory: "."
    icon: "help-circle"
    tags:
      - help
      - documentation
    autoPause: false
    showOutput: true
