# Conductor Workspace Settings for AddMin
# Runscripts for launching and managing AddMin development environment

[scripts.run.launch-apps]
command = "./scripts/launch-apps.sh"
default = true
icon = "rocket"
available_in = "local"

[scripts.run.launch-fast]
command = "./scripts/launch-apps.sh"
args = ["--no-build"]
icon = "zap"
available_in = "local"

[scripts.run.launch-quiet]
command = "./scripts/launch-apps.sh"
args = ["--no-open"]
icon = "server"
available_in = "local"

[scripts.run.stop-all]
command = "make docker-down"
icon = "stop-circle"
available_in = "local"

[scripts.run.logs]
command = "make docker-logs"
icon = "file-text"
available_in = "local"

[scripts.run.db-shell]
command = "make docker-db-shell"
icon = "database"
available_in = "local"

[scripts.run.migrate]
command = "make docker-db-migrate"
icon = "arrow-up-circle"
available_in = "local"

[scripts.run.type-check]
command = "pnpm type-check"
icon = "check-circle"
available_in = "local"

[scripts.run.help]
command = "./scripts/launch-apps.sh"
args = ["--help"]
icon = "help-circle"
available_in = "local"
