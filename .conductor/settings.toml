# Conductor Workspace Settings for AddMin
# Runscripts for launching and managing AddMin development environment

[[runscripts]]
id = "launch-apps"
name = "🚀 Launch Web Apps"
description = "Start all services (PostgreSQL, API, Website, Operator, Tenant) with Docker and open in browser"
command = "./scripts/launch-apps.sh"
cwd = "/Users/ayushkatyal/conductor/workspaces/addmin-repo/port-louis"
interactive = true
keepOpen = true

[[runscripts]]
id = "launch-fast"
name = "⚡ Launch (Skip Build)"
description = "Start services without rebuilding Docker images (faster startup)"
command = "./scripts/launch-apps.sh --no-build"
cwd = "/Users/ayushkatyal/conductor/workspaces/addmin-repo/port-louis"
interactive = true
keepOpen = true

[[runscripts]]
id = "launch-quiet"
name = "🔇 Launch (No Browser)"
description = "Start all services but don't open browser"
command = "./scripts/launch-apps.sh --no-open"
cwd = "/Users/ayushkatyal/conductor/workspaces/addmin-repo/port-louis"
interactive = true
keepOpen = true

[[runscripts]]
id = "stop-all"
name = "🛑 Stop Services"
description = "Stop all Docker containers"
command = "make docker-down"
cwd = "/Users/ayushkatyal/conductor/workspaces/addmin-repo/port-louis"
interactive = false
keepOpen = false

